<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un Regalo Para Ti ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:linear-gradient(135deg,#ffd6e7,#ffc2d1,#ffe5ec);
    overflow:hidden;
}

/* Corazones flotando */
.hearts{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:0;
}

.heart{
    position:absolute;
    color:#ff6b9a;
    font-size:20px;
    animation:float 8s linear infinite;
    opacity:0.7;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-120px);
        opacity:0;
    }
}

.container{
    position:relative;
    z-index:2;
    text-align:center;
}

/* Caja */
.gift-box{
    position:relative;
    width:220px;
    height:180px;
    margin:auto;
}

.box-bottom{
    width:220px;
    height:140px;
    background:#ff8fab;
    border-radius:10px;
    position:absolute;
    bottom:0;
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.box-bottom::before{
    content:"";
    position:absolute;
    left:95px;
    width:30px;
    height:140px;
    background:#fff;
}

.lid{
    position:absolute;
    width:240px;
    height:50px;
    left:-10px;
    top:0;
    background:#ff7096;
    border-radius:10px;
    transform-origin:left center;
    transition:1.5s;
    box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.lid::before{
    content:"";
    position:absolute;
    left:105px;
    width:30px;
    height:50px;
    background:white;
}

.open .lid{
    transform:rotate(-120deg);
}

/* Botón */
button{
    margin-top:40px;
    padding:14px 28px;
    border:none;
    border-radius:30px;
    background:#ff5d8f;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    background:#ff3f7d;
}

/* Carta */
.letter{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:white;
    width:320px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    transition:1.2s;
    z-index:999; /* agregado */
}

.letter h2{
    color:#ff4f87;
    margin-bottom:15px;
}

.letter p{
    color:#555;
    font-size:20px;
}

.show-letter{
    transform:translate(-50%,-50%) scale(1);
}
</style>

</head>
<body>

<div class="hearts"></div>

<div class="container">
    <div class="gift-box" id="giftBox">
        <div class="lid"></div>
        <div class="box-bottom"></div>
    </div>

    <button onclick="openGift()">
        💝 Presione aquí para abrir el regalo
    </button>
</div>

<div class="letter" id="letter">
    <h2>💖 Para mi princesa 💖</h2>
    <p>
        Te amo mucho princesa ❤️<br><br>
        Gracias por hacer mis días más felices y llenos de amor.
    </p>
</div>

<script>
function openGift() {
    document.getElementById("giftBox").classList.add("open");

    setTimeout(() => {
        document.getElementById("letter")
        .classList.add("show-letter");
    }, 900);
}

// Corazones flotando
const heartsContainer = document.querySelector(".hearts");

setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "%";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";
    heart.style.animationDuration = (5 + Math.random() * 5) + "s";

    heartsContainer.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 10000);

}, 400);
</script>

</body>
</html>
